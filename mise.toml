monorepo_root = true

[monorepo]
config_roots = [
    ".github",
    "android",
    "dev-certs",
    "fdroid",
    "generic-client",
    "linux",
    "macos",
    "poll-cli",
    "server",
    "shared",
]

[tools]
cargo-binstall = "latest"

[settings]
cargo.binstall_quickinstall = true
cargo.binstall_only = true

[env]
RUST_LOG = "{{ get_env(name='RUST_LOG', default='info') }}"
RUST_LOG_STYLE = "always"
MPCLIPBOARD_TOKEN = "sekret"

[task_config]
shell = "bash -euo pipefail -c"

[tasks.fmt]
depends = ["//...:cargo:fmt"]

[tasks.clippy]
run = "mise run --jobs 1 '//...:cargo:clippy'"

[tasks.test]
run = "mise run --jobs 1 '//...:cargo:test'"

[tasks.outdated]
run = [
    "mise run --jobs 1 '//...:cargo:outdated'",
    { task = "//.github:outdated" },
]

[tasks.update]
run = "mise run --jobs 1 '//...:cargo:update'"
