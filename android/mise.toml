include = ["../.mise/android.toml"]

[task_config]
shell = "bash -euo pipefail -c"

[tools]
java = "temurin-25"
gradle = "9.8.0"
android-sdk = "17.0"
imagemagick = "latest"

[env]
GRADLE_USER_HOME = "{{config_root}}/.cache/gradle"
ANDROID_USER_HOME = "{{config_root}}/.cache/android"
ANDROID_EMULATOR_HOME = "{{config_root}}/.cache/android"
ANDROID_AVD_HOME = "{{config_root}}/.cache/android/avd"
ANDROID_CMAKE_VERSION = "4.1.2"
_.path = ["{{config_root}}/.cache/android-sdk/platform-tools"]
ANDROID_KEY_ALIAS = "release"
_.file = { path = ".env", redacted = true }

[hooks]
postinstall = { task = "setup" }

[tasks.setup]
hide = true
run = """
    rustup target add aarch64-linux-android

    (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null)
    sdkmanager --sdk_root="$ANDROID_HOME" \
        "platform-tools" \
        "platforms;android-37.0" \
        "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
        "ndk;$ANDROID_NDK_VERSION" \
        "cmake;$ANDROID_CMAKE_VERSION"

    echo "sdk.dir=$ANDROID_HOME" > local.properties

    gradle --no-daemon wrapper --gradle-version "$(mise current gradle)"
"""

[tasks."debug:apk"]
depends = ["//generic-client:build:android:debug"]
run = """
    gradle --no-daemon assembleDebug
    ls -l build/outputs/apk/debug/mpclipboard-debug.apk
"""

[tasks."release:apk"]
depends = ["//generic-client:build:android:release"]
usage = '''
flag "--version <version>" required=#true help="Release version in MAJOR.MINOR.PATCH format"
flag "--out <out>" required=#true help="Absolute path to write the .apk to"
'''
run = """
    gradle --no-daemon assembleRelease -PappVersion="{{usage.version}}"
    cp build/outputs/apk/release/mpclipboard-release.apk "{{usage.out}}"
"""

[tasks."install:debug"]
run = "adb install -r build/outputs/apk/debug/mpclipboard-debug.apk"

[tasks."install:release"]
run = "adb install -r build/outputs/apk/release/mpclipboard-release.apk"

[tasks.logs]
run = """
    adb logcat --pid="$(adb shell pidof -s dev.ibylich.mpclipboard)"
"""

[tasks.generate]
run = """
    mkdir -p src/main/res/drawable-nodpi
    magick ../icon_512x512.png \
        -resize 230x230 \
        -background none \
        -gravity center \
        -extent 432x432 \
        -strip \
        -define png:exclude-chunks=date,time \
        src/main/res/drawable-nodpi/icon.png
"""

[tasks."macos:androidstudio"]
run = '"/Applications/Android Studio.app/Contents/MacOS/studio" "$PWD"'
