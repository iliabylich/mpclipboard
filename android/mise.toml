include = ["../.mise/android.toml"]

[task_config]
shell = "bash -euo pipefail -c"

[tools]
java = "temurin-25"
gradle = "9.8.0"
android-sdk = "17.0"

[env]
GRADLE_USER_HOME = "{{config_root}}/.cache/gradle"
ANDROID_USER_HOME = "{{config_root}}/.cache/android"
ANDROID_CMAKE_VERSION = "4.1.2"

[hooks]
postinstall = { task = "setup" }

[tasks.setup]
hide = true
run = """
    rustup target add aarch64-linux-android

    (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null)
    sdkmanager --sdk_root="$ANDROID_HOME" \
        "platforms;android-37.0" \
        "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
        "ndk;$ANDROID_NDK_VERSION" \
        "cmake;$ANDROID_CMAKE_VERSION"

    echo "sdk.dir=$ANDROID_HOME" > local.properties

    gradle --no-daemon wrapper --gradle-version "$(mise current gradle)"
"""

[tasks."build:debug"]
depends = ["//generic-client:build:android:debug"]
run = """
    gradle --no-daemon assembleDebug
    ls -l build/outputs/aar/mpclipboard-debug.aar
"""

[tasks."build:release"]
depends = ["//generic-client:build:android:release"]
run = """
    gradle --no-daemon assembleRelease
    ls -l build/outputs/aar/mpclipboard-release.aar
"""

[tasks.release]
usage = '''
flag "--debug-out <debug_out>" required=#true help="Absolute path to write the debug .aar to"
flag "--release-out <release_out>" required=#true help="Absolute path to write the release .aar to"
'''
run = [
    { task = "build:debug" },
    { task = "build:release" },
    'cp build/outputs/aar/mpclipboard-debug.aar "{{usage.debug_out}}"',
    'cp build/outputs/aar/mpclipboard-release.aar "{{usage.release_out}}"',
]
