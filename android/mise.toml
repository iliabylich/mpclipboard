[task_config]
shell = "bash -euo pipefail -c"

[tools]
java = "temurin-25"
gradle = "9.8.0"
android-sdk = "17.0"

[env]
GRADLE_USER_HOME = "{{config_root}}/.cache/gradle"
ANDROID_USER_HOME = "{{config_root}}/.cache/android"
ANDROID_EMULATOR_HOME = "{{config_root}}/.cache/android"
ANDROID_AVD_HOME = "{{config_root}}/.cache/android/avd"
ANDROID_HOME = "{{config_root}}/.cache/android-sdk"
ANDROID_SDK_ROOT = "{{config_root}}/.cache/android-sdk"
ANDROID_NDK_VERSION = "30.0.16248370"
ANDROID_NDK_HOME = "{{config_root}}/.cache/android-sdk/ndk/{{env.ANDROID_NDK_VERSION}}"
ANDROID_CMAKE_VERSION = "4.1.2"
_.path = ["{{config_root}}/.cache/android-sdk/platform-tools"]
ANDROID_KEY_ALIAS = "release"
FDROID_KEY_ALIAS = "release"
_.file = { path = ".env", redacted = true }

[tasks."setup:rust-target"]
run = "rustup target add aarch64-linux-android"

[tasks."setup:cargo-ndk"]
run = """
    if ! command -v cargo-binstall > /dev/null 2>&1; then
        cargo install cargo-binstall --locked
    fi

    if ! command -v cargo-ndk >/dev/null 2>&1; then
        cargo binstall --no-confirm cargo-ndk
    fi
"""

[tasks."setup:android-sdk"]
run = """
    (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null)
    sdkmanager --sdk_root="$ANDROID_HOME" \
        "platform-tools" \
        "platforms;android-37.0" \
        "build-tools;36.0.0" \
        "ndk;$ANDROID_NDK_VERSION" \
        "cmake;$ANDROID_CMAKE_VERSION"
"""

[tasks."setup:local-properties"]
run = 'echo "sdk.dir=$ANDROID_HOME" > local.properties'

[tasks."setup:gradle-wrapper"]
run = 'gradle --no-daemon wrapper --gradle-version "$(mise current gradle)"'

[tasks."build:generic-client"]
depends = ["setup:rust-target", "setup:cargo-ndk"]
run = """
    pushd ../generic-client
        cargo ndk -t arm64-v8a build --release
        ls -l target/aarch64-linux-android/release/libmpclipboard_generic_client.a bindings.h
    popd
"""

[tasks."build:debug"]
depends = ["setup:local-properties", "build:generic-client"]
run = """
    gradle --no-daemon assembleDebug
    ls -l build/outputs/apk/debug/mpclipboard-debug.apk
"""

[tasks."build:release"]
depends = ["setup:local-properties", "build:generic-client"]
usage = 'arg "<version>" help="Release version in MAJOR.MINOR.PATCH format"'
run = """
    gradle --no-daemon assembleRelease -PappVersion="${usage_version}"
    ls -l build/outputs/apk/release/mpclipboard-release.apk
"""

[tasks."install:debug"]
run = "adb install -r build/outputs/apk/debug/mpclipboard-debug.apk"

[tasks."install:release"]
run = "adb install -r build/outputs/apk/release/mpclipboard-release.apk"

[tasks.logs]
run = """
    adb logcat --pid="$(adb shell pidof -s dev.ibylich.mpclipboard)"
"""

[tasks."fdroid:update"]
run = """
    pushd fdroid
        chmod 600 config.yml

        rm -rf metadata repo srclibs tmp
        mkdir -p repo

        cp ../build/outputs/apk/release/mpclipboard-release.apk repo/mpclipboard.apk

        fdroid update --verbose --create-metadata
    popd
"""

[tasks."macos:androidstudio"]
depends = ["setup:local-properties", "setup:gradle-wrapper"]
run = '"/Applications/Android Studio.app/Contents/MacOS/studio" "$PWD"'
