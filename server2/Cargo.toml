[package]
name = "server2"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server2"
path = "src/main.rs"
test = false
bench = false

[dependencies]
externally-driven-async-rt = { path = "../../externally-driven-async-rt" }
rustix = { version = "1", default-features = false, features = ["event", "stdio"] }
log = { version = "0.4", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
