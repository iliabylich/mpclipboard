[package]
name = "mpclipboard-shared"
version = "0.1.0"
edition = "2024"

[dependencies]
rustix = { version = "1", features = ["time", "fs", "event", "net"] }
boml = "2"
thiserror = { version = "2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", features = ["event"] }
