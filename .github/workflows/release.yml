name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: release version in MAJOR.MINOR.PATCH version, no "v" prefix
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: iliabylich/validate-release-version@v1
        with:
          version: ${{ inputs.version }}

  build-server:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt update && sudo apt install musl musl-dev
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - uses: jdx/mise-action@v5
        with:
          working_directory: ./server
      - run: mise //server:release:deb --version "${{ inputs.version }}" --out "$PWD/mpclipboard-server_${{ inputs.version }}_amd64.deb"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: server-deb
          path: mpclipboard-server_${{ inputs.version }}_amd64.deb

  build-linux-client:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v5
        with:
          working_directory: ./linux
      - run: mise //linux:release:deb --version "${{ inputs.version }}" --out "$PWD/mpclipboard-client_${{ inputs.version }}_amd64.deb"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-client-deb
          path: mpclipboard-client_${{ inputs.version }}_amd64.deb

  build-macos-client:
    needs: validate
    runs-on: macos-latest
    steps:
      - run: ls -l /Applications | grep Xcode
      - run: sudo xcode-select -switch /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v5
        with:
          working_directory: ./macos
      - run: mise //macos:release:dmg --version "${{ inputs.version }}" --out "$PWD/mpclipboard_${{ inputs.version }}_arm64.dmg"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: macos-client-dmg
          path: mpclipboard_${{ inputs.version }}_arm64.dmg

  build-android-client:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v5
        with:
          working_directory: ./android
      - run: |
          mise //android:release \
            --debug-out "$PWD/mpclipboard_${{ inputs.version }}_arm64_debug.aar" \
            --release-out "$PWD/mpclipboard_${{ inputs.version }}_arm64.aar"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: android-client-aar
          path: |
            mpclipboard_${{ inputs.version }}_arm64_debug.aar
            mpclipboard_${{ inputs.version }}_arm64.aar

  release:
    needs:
      - build-server
      - build-linux-client
      - build-macos-client
      - build-android-client
    runs-on: ubuntu-latest
    env:
      DEB_DEPLOY_URL: ${{ secrets.DEB_DEPLOY_URL }}
      DEB_DEPLOY_TOKEN: ${{ secrets.DEB_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-{deb,dmg,aar}"
          merge-multiple: true

      - run: ls -l

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "*.deb,*.dmg,*.aar"
          tag: v${{ inputs.version }}

      - run: ./.github/scripts/deploy-deb.sh mpclipboard-server_${{ inputs.version }}_amd64.deb
      - run: ./.github/scripts/deploy-deb.sh mpclipboard-client_${{ inputs.version }}_amd64.deb

      - env:
          GH_TOKEN: ${{ secrets.HOMEBREW_DEPLOY_GH_TOKEN }}
        run: |
          gh workflow run \
            update.yml \
            --repo iliabylich/homebrew-mpclipboard \
            --ref master \
            -f version="${{ inputs.version }}"
