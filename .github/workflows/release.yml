  build-macos-client:
    runs-on: macos-latest
    steps:
      - run: ls -l /Applications | grep Xcode
      - run: sudo xcode-select -switch /Applications/Xcode_26.3.app/Contents/Developer
      - run: brew install xcodegen imagemagick
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: dtolnay/rust-toolchain@stable
      - run: just macos::release-dmg "${{ inputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: mpclipboard_${{ inputs.version }}_arm64.dmg
          path: mpclipboard_${{ inputs.version }}_arm64.dmg
