[package]
name = "mpclipboard-server"
version = "0.1.0"
edition = "2024"
authors = ["Ilya Bylich"]
license = "MIT"
description = "MPClipboard server"

[[bin]]
name = "mpclipboard-server"
path = "src/main.rs"
test = false
bench = false

[dependencies]
externally-driven-async-rt = { version = "0.3.0" }
mpclipboard-shared = { path = "../shared" }
rustix = { version = "1", default-features = false, features = [
    "event",
    "stdio",
    "termios",
] }
httparse = { version = "1", default-features = false }

[features]
strace-like = ["externally-driven-async-rt/strace-like"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true

[package.metadata.deb]
assets = [
    [
        "target/release/mpclipboard-server",
        "usr/bin/mpclipboard-server",
        "755",
    ],
    [
        "debian/mpclipboard-server.service",
        "lib/systemd/system/mpclipboard-server.service",
        "644",
    ],
]
extended-description = ""
