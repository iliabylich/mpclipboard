[task_config]
shell = "bash -euo pipefail -c"
includes = ["../.mise/rust.toml"]

[env]
MPCLIPBOARD_BIND_ADDRESS = "127.0.0.1:3000"

[tasks."build:debug"]
hide = true
run = "cargo build"

[tasks."build:release"]
hide = true
run = "cargo build --target=x86_64-unknown-linux-musl --release"

[tasks.app]
hide = true
depends = ["build:debug"]
run = "target/debug/mpclipboard-server"

[tasks.caddy]
hide = true
tools = { caddy = "latest" }
run = '''
caddy run --adapter caddyfile --config - <<'EOF'
{
	default_sni 127.0.0.1
	auto_https disable_redirects
}

localhost:8443, 127.0.0.1:8443 {
	tls ../dev-certs/cert.pem ../dev-certs/key.pem
	reverse_proxy 127.0.0.1:3000 {
		flush_interval -1
	}
}
EOF
'''

[tasks.dev]
depends = ["app", "caddy"]

[tasks."release:deb"]
depends = ["build:release"]
tools = { "cargo:cargo-deb" = "latest" }
usage = '''
flag "--version <version>" required=#true help="Release version in MAJOR.MINOR.PATCH format"
flag "--out <out>" required=#true help="Absolute path to write the .deb to"
'''
run = [
	'cargo-deb --no-build --deb-version "{{usage.version}}" -p mpclipboard-server --target=x86_64-unknown-linux-musl',
	'mv "target/debian/mpclipboard-server_{{usage.version}}_amd64.deb" "{{usage.out}}"',
]
