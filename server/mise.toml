[task_config]
shell = "bash -euo pipefail -c"

[tools]
"cargo:cargo-deb" = "latest"
caddy = "latest"

[env]
MPCLIPBOARD_URL = "http://127.0.0.1:3000"

[tasks.app]
hide = true
run = 'cargo run'

[tasks.caddy]
hide = true
run = '''
caddy run --adapter caddyfile --config - <<'EOF'
{
	default_sni 127.0.0.1
	auto_https disable_redirects
}

localhost:8443, 127.0.0.1:8443 {
	tls ../dev-certs/cert.pem ../dev-certs/key.pem
	reverse_proxy 127.0.0.1:3000 {
		flush_interval -1
	}
}
EOF
'''

[tasks.dev]
depends = ["app", "caddy"]

[tasks."build:release"]
hide = true
run = "cargo build --target=x86_64-unknown-linux-musl --release"

[tasks."release:deb"]
depends = ["build:release"]
usage = '''
flag "--version <version>" required=#true help="Release version in MAJOR.MINOR.PATCH format"
flag "--out <out>" required=#true help="Absolute path to write the .deb to"
'''
run = """
    cargo-deb --no-build --deb-version "${usage_version}" -p mpclipboard-server --target=x86_64-unknown-linux-musl
    mv "target/debian/mpclipboard-server_${usage_version}_amd64.deb" "${usage_out}"
"""

[tasks."release:container"]
depends = ["build:release"]
usage = 'flag "--version <version>" required=#true help="Release version in MAJOR.MINOR.PATCH format"'
run = """
    docker build -t "ghcr.io/iliabylich/mpclipboard:${usage_version}" .
    docker push "ghcr.io/iliabylich/mpclipboard:${usage_version}"

    docker tag "ghcr.io/iliabylich/mpclipboard:${usage_version}" ghcr.io/iliabylich/mpclipboard:latest
    docker push ghcr.io/iliabylich/mpclipboard:latest
"""

[tasks.clippy]
hide = true
run = "cargo clippy"
