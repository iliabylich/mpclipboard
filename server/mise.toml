[task_config]
shell = "bash -euo pipefail -c"

[tools]
caddy = "latest"

[env]
MPCLIPBOARD_URL = "http://127.0.0.1:3000"
MPCLIPBOARD_TOKEN = "sekret"

[tasks.app]
usage = 'arg "[log]" default="info"'
run = 'RUST_LOG_STYLE=always RUST_LOG="${usage_log}" cargo run'

[tasks.caddy]
run = '''
caddy run --adapter caddyfile --config - <<'EOF'
{
	default_sni 127.0.0.1
}

127.0.0.1:8443 {
	tls ../dev-certs/cert.pem ../dev-certs/key.pem
	reverse_proxy 127.0.0.1:3000
}
EOF
'''

[tasks.dev]
depends = ["app", "caddy"]

[tasks."build:musl"]
hide = true
run = "cargo build --target=x86_64-unknown-linux-musl --release"

[tasks."release:deb"]
depends = ["build:musl"]
usage = 'arg "<version>" help="Release version in MAJOR.MINOR.PATCH format"'
run = """
    cargo deb --deb-version "${usage_version}" -p mpclipboard-server --target=x86_64-unknown-linux-musl
    mv "target/debian/mpclipboard-server_${usage_version}_amd64.deb" ..
    mv target/x86_64-unknown-linux-musl/release/mpclipboard-server "../mpclipboard-server-bin-${usage_version}"
"""

[tasks."release:container"]
depends = ["build:musl"]
usage = 'arg "<version>" help="Release version in MAJOR.MINOR.PATCH format"'
run = """
    docker build -t "ghcr.io/iliabylich/mpclipboard:${usage_version}" .
    docker push "ghcr.io/iliabylich/mpclipboard:${usage_version}"

    docker tag "ghcr.io/iliabylich/mpclipboard:${usage_version}" ghcr.io/iliabylich/mpclipboard:latest
    docker push ghcr.io/iliabylich/mpclipboard:latest
"""
