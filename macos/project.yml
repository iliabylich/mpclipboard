name: mpclipboard

targets:
  mpclipboard:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - src
      - Assets.xcassets
    settings:
      base:
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.mpclipboard.MPClipboard
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/src/BridgingHeader.h
        SWIFT_VERSION: 6.0
      configs:
        Debug:
          OTHER_LDFLAGS: ../generic-client/target/debug/libmpclipboard_generic_client.a
        Release:
          OTHER_LDFLAGS: ../generic-client/target/release/libmpclipboard_generic_client.a
