language = "C"
pragma_once = true
usize_is_size_t = true
style = "type"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[export]
prefix = "mpclipboard_"
exclude = ["abort", "posix_memalign", "free"]

[parse]
parse_deps = true
include = ["mpclipboard-generic-client"]
