include = ["../.mise/android.toml"]

[task_config]
shell = "bash -euo pipefail -c"
includes = ["../.mise/rust.toml"]

[tasks.cbindgen]
tools = { "cargo:cbindgen" = "latest" }
run = "cbindgen --output bindings.h"

[tasks."build:debug"]
hide = true
run = "cargo build"

[tasks."build:release"]
hide = true
run = "cargo build --release"

[tasks."build:android:debug"]
hide = true
tools = { "cargo:cargo-ndk" = "latest" }
run = [
    "cargo ndk -t arm64-v8a build",
    "ls -l target/aarch64-linux-android/debug/libmpclipboard_generic_client_ffi.a bindings.h",
]

[tasks."build:android:release"]
hide = true
tools = { "cargo:cargo-ndk" = "latest" }
run = [
    "cargo ndk -t arm64-v8a build --release",
    "ls -l target/aarch64-linux-android/release/libmpclipboard_generic_client_ffi.a bindings.h",
]
