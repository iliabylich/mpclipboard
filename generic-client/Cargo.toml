[package]
name = "mpclipboard-generic-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
libc = "0.2"
rustix = { version = "1", features = ["net"] }
mpclipboard-shared = { path = "../shared" }
log = "0.4"
thiserror = "2"
mini-sansio-dns = "2"
h3wire = "0.1"
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring", "log"] }
bytes = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
env_logger = { version = "0.11", default-features = false, features = [
    "color",
] }

[dev-dependencies]
rustix = { version = "1", features = ["event"] }
