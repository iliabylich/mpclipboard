[package]
name = "mpclipboard-generic-client"
version = "0.1.0"
edition = "2024"

[dependencies]
externally-driven-async-rt = { version = "0.5.1" }
mpclipboard-shared = { path = "../shared" }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
] }
webpki-roots = "1"
rustix = { version = "1", default-features = false, features = ["fs", "time"] }
mini-sansio-dns = "2"
httparse = { version = "1", default-features = false }
log = { version = "0.4", default-features = false }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
rustix = { version = "1", default-features = false, features = ["event"] }

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
