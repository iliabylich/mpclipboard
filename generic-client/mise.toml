[task_config]
shell = "bash -euo pipefail -c"
includes = ["../.mise/rust.toml"]

[env]
MPCLIPBOARD_URL = "https://127.0.0.1:8443"
MPCLIPBOARD_ID = "generic-client2"

[tasks.cbindgen]
tools = { "cargo:cbindgen" = "latest" }
run = "cbindgen --output bindings.h"

[tasks."build:debug"]
hide = true
run = "cargo build"

[tasks."build:release"]
hide = true
run = "cargo build --release"

[tasks."build:cli:debug"]
hide = true
run = "cargo build --example cli"

[tasks.dev]
usage = 'arg "<id>"'
depends = ["build:cli:debug"]
run = 'MPCLIPBOARD_ID="{{usage.id}}" target/debug/examples/cli'
